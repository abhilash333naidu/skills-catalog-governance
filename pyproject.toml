[build-system]
# setuptools chosen over hatchling: it natively supports a flat single-module
# layout (py-modules + package-dir mapping) so scripts/catalog_governance.py does
# not need to move. Hatchling auto-detects src/ packages and would require extra
# force-include/sources overrides to salvage one flat module from scripts/.
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skills-catalog-governance"
# Version sourced from scripts/catalog_governance.py (__version__) so there is
# a single place of truth. See [tool.setuptools.dynamic].
dynamic = ["version"]
description = "Fail-closed governance helpers for skills-catalog management (detect, group, grade, archive, certify)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["skills", "catalog", "governance", "CLI"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]
# Runtime is stdlib-only by design -- never add dependencies here.
dependencies = []

[project.optional-dependencies]
# Dev-only tooling, kept out of the runtime path (mirrors requirements-dev.txt).
# `pip install -e .[dev]` is equivalent to `pip install -r requirements-dev.txt`.
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
skills-catalog-governance = "catalog_governance:main"

# Flat module strategy: keep scripts/catalog_governance.py exactly where it is
# (the curl-bash/irm-iex installer and the test suite rely on that location) and
# expose it as a top-level `catalog_governance` module via a package-dir mapping.
[tool.setuptools]
py-modules = ["catalog_governance"]

[tool.setuptools.package-dir]
"" = "scripts"

[tool.setuptools.dynamic]
version = { attr = "catalog_governance.__version__" }