name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test · py${{ matrix.python-version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Run test suite (with subprocess coverage)
        # Plain `pytest --cov` cannot see inside the CLI subprocesses the suite
        # spawns; coverage run + combine + sitecustomize.py can. Gate is 72%,
        # the measured real coverage once subprocess shards are merged.
        run: |
          coverage run --rcfile=.coveragerc -m pytest tests/ -q
          coverage combine
          coverage report --rcfile=.coveragerc --fail-under=72

      - name: Verify package integrity
        run: python scripts/catalog_governance.py check-package --root .

      - name: Check docs/implementation drift
        run: python scripts/check_docs_drift.py .

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install ruff
      - name: Run ruff
        run: ruff check scripts/ tests/ --output-format=github