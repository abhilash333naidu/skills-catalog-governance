<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-labelledby="features-title features-desc">
  <title id="features-title">Key Capabilities</title>
  <desc id="features-desc">Six core capabilities of Skills Catalog Governance with visual icons (light)</desc>
  
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6f8fa"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    
    <filter id="iconGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="cardShadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <rect width="1000" height="320" fill="url(#bgGrad3)"/>
  
  <!-- 6 capability cards -->
  <g transform="translate(40, 30)">
    <!-- Card 1: DISCOVER -->
    <g transform="translate(0, 0)" filter="url(#cardShadow3)">
      <rect x="0" y="0" width="148" height="260" rx="12" fill="#ffffff" stroke="#d0d7de"/>
      
      <!-- Icon -->
      <g transform="translate(74, 50)">
        <circle r="32" fill="#58a6ff" opacity="0.15" filter="url(#iconGlow)"/>
        <circle r="32" fill="none" stroke="#58a6ff" stroke-width="2"/>
        <!-- Magnifying glass icon -->
        <circle cx="-4" cy="-4" r="12" fill="none" stroke="#58a6ff" stroke-width="3" stroke-linecap="round"/>
        <line x1="6" y1="6" x2="18" y2="18" stroke="#58a6ff" stroke-width="3" stroke-linecap="round"/>
      </g>
      
      <text x="74" y="110" font-family="system-ui, sans-serif" font-size="15" font-weight="700" 
            fill="#58a6ff" text-anchor="middle">DISCOVER</text>
      <text x="74" y="130" font-family="system-ui, sans-serif" font-size="11" 
            fill="#57606a" text-anchor="middle">detect-skills</text>
      
      <text x="74" y="160" font-family="system-ui, sans-serif" font-size="11" font-weight="500" 
            fill="#1f2328" text-anchor="middle">Inventory</text>
      <text x="74" y="180" font-family="system-ui, sans-serif" font-size="10" 
            fill="#57606a" text-anchor="middle">211 skills across</text>
      <text x="74" y="195" font-family="system-ui, sans-serif" font-size="10" 
            fill="#57606a" text-anchor="middle">5 stores</text>
      
      <text x="74" y="225" font-family="system-ui, sans-serif" font-size="11" font-weight="500" 
            fill="#1f2328" text-anchor="middle">SHA-256</text>
      <text x="74" y="242" font-family="system-ui, sans-serif" font-size="10" 
            fill="#57606a" text-anchor="middle">fingerprinting</text>
    </g>
    
    <!-- Card 2: GROUP -->
    <g transform="translate(168, 0)" filter="url(#cardShadow3)">
      <rect x="0" y="0" width="148" height="260" rx="12" fill="#ffffff" stroke="#d0d7de"/>
      
      <g transform="translate(74, 50)">
        <circle r="32" fill="#d29922" opacity="0.15" filter="url(#iconGlow)"/>
        <circle r="32" fill="none" stroke="#d29922" stroke-width="2"/>
        <!-- Nodes connecting -->
        <circle cx="-14" cy="-4" r="6" fill="#d29922"/>
        <circle cx="14" cy="-4" r="6" fill="#d29922"/>
        <circle cx="0" cy="14" r="6" fill="#d29922"/>
        <line x1="-14" y1="-4" x2="0" y2="14" stroke="#d29922" stroke-width="2" stroke-linecap="round"/>
        <line x1="14" y1="-4" x2="0" y2="14" stroke="#d29922" stroke-width="2" stroke-linecap="round"/>
      </g>
      
      <text x="74" y="110" font-family="system-ui, sans-serif" font-size="15" font-weight="700" 
            fill="#d29922" text-anchor="middle">GROUP</text>
      <text x="74" y="130" font-family="system-ui, sans-serif" font-size="11" 
            fill="#57606a" text-anchor="middle">detect-groups</text>
      
      <text x="74" y="160" font-family="system-ui, sans-serif" font-size="11" font-weight="500" 
            fill="#1f2328" text-anchor="middle">Candidate</text>
      <text x="74" y="180" font-family="system-ui, sans-serif" font-size="10" 
            fill="#57606a" text-anchor="middle">19 families</text>
      <text x="74" y="195" font-family="system-ui, sans-serif" font-size="10" 
            fill="#57606a" text-anchor="middle">strong-pair only</text>
      
      <text x="74" y="225" font-family="system-ui, sans-serif" font-size="11" font-weight="500" 
            fill="#1f2328" text-anchor="middle">TF-IDF +</text>
      <text x="74" y="242" font-family="system-ui, sans-serif" font-size="10" 
            fill="#57606a" text-anchor="middle">word overlap</text>
    </g>
    
    <!-- Card 3: COUNCIL -->
    <g transform="translate(336, 0)" filter="url(#cardShadow3)">
      <rect x="0" y="0" width="148" height="260" rx="12" fill="#ffffff" stroke="#d0d7de"/>
      
      <g transform="translate(74, 50)">
        <circle r="32" fill="#a371f7" opacity="0.15" filter="url(#iconGlow)"/>
        <circle r="32" fill="none" stroke="#a371f7" stroke-width="2"/>
        <!-- 5 advisors -->
        <circle cx="0" cy="-16" r="5" fill="#a371f7" opacity="0.8"/>
        <circle cx="-12" cy="-4" r="5" fill="#a371f7" opacity="0.6"/>
        <circle cx="12" cy="-4" r="5" fill="#a371f7" opacity="0.6"/>
        <circle cx="-6" cy="8" r="5" fill="#a371f7" opacity="0.4"/>
        <circle cx="6" cy="8" r="5" fill="#a371f7" opacity="0.4"/>
        <circle cx="0" cy="4" r="8" fill="none" stroke="#a371f7" stroke-width="2"/>
      </g>
      
      <text x="74" y="110" font-family="system-ui, sans-serif" font-size="15" font-weight="700" 
            fill="#a371f7" text-anchor="middle">COUNCIL</text>
      <text x="74" y="130" font-family="system-ui, sans-serif" font-size="11" 
            fill="#57606a" text-anchor="middle">llm-council</text>
      
      <text x="74" y="160" font-family="system-ui, sans-serif" font-size="11" font-weight="500" 
            fill="#1f2328" text-anchor="middle">Semantic</text>
      <text x="74" y="180" font-family="system-ui, sans-serif" font-size="10" 
            fill="#57606a" text-anchor="middle">MERGE verdict</text>
      <text x="74" y="195" font-family="system-ui, sans-serif" font-size="10" 
            fill="#57606a" text-anchor="middle">generator + executor</text>
      
      <text x="74" y="225" font-family="system-ui, sans-serif" font-size="11" font-weight="500" 
            fill="#1f2328" text-anchor="middle">5 advisors</text>
      <text x="74" y="242" font-family="system-ui, sans-serif" font-size="10" 
            fill="#57606a" text-anchor="middle">blind reviews</text>
    </g>
    
    <!-- Card 4: VERIFY -->
    <g transform="translate(504, 0)" filter="url(#cardShadow3)">
      <rect x="0" y="0" width="148" height="260" rx="12" fill="#ffffff" stroke="#d0d7de"/>
      
      <g transform="translate(74, 50)">
        <circle r="32" fill="#3fb950" opacity="0.15" filter="url(#iconGlow)"/>
        <circle r="32" fill="none" stroke="#3fb950" stroke-width="2"/>
        <!-- Check marks -->
        <path d="M-10,0 L-2,8 L10,-8" fill="none" stroke="#3fb950" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M-12,10 L-4,18 L10,-2" fill="none" stroke="#3fb950" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      
      <text x="74" y="110" font-family="system-ui, sans-serif" font-size="15" font-weight="700" 
            fill="#3fb950" text-anchor="middle">VERIFY</text>
      <text x="74" y="130" font-family="system-ui, sans-serif" font-size="11" 
            fill="#57606a" text-anchor="middle">loss-check</text>
      
      <text x="74" y="160" font-family="system-ui, sans-serif" font-size="11" font-weight="500" 
            fill="#1f2328" text-anchor="middle">Content &amp;</text>
      <text x="74" y="180" font-family="system-ui, sans-serif" font-size="10" 
            fill="#57606a" text-anchor="middle">behaviour</text>
      <text x="74" y="195" font-family="system-ui, sans-serif" font-size="10" 
            fill="#57606a" text-anchor="middle">preserved</text>
      
      <text x="74" y="225" font-family="system-ui, sans-serif" font-size="11" font-weight="500" 
            fill="#1f2328" text-anchor="middle">Golden gate</text>
      <text x="74" y="242" font-family="system-ui, sans-serif" font-size="10" 
            fill="#57606a" text-anchor="middle">6/6 match</text>
    </g>
    
    <!-- Card 5: BENCHMARK -->
    <g transform="translate(672, 0)" filter="url(#cardShadow3)">
      <rect x="0" y="0" width="148" height="260" rx="12" fill="#ffffff" stroke="#d0d7de"/>
      
      <g transform="translate(74, 50)">
        <circle r="32" fill="#a371f7" opacity="0.15" filter="url(#iconGlow)"/>
        <circle r="32" fill="none" stroke="#a371f7" stroke-width="2"/>
        <!-- Bar chart -->
        <rect x="-16" y="6" width="10" height="18" fill="#a371f7" opacity="0.8" rx="1"/>
        <rect x="-4" y="0" width="10" height="24" fill="#3fb950" opacity="0.8" rx="1"/>
        <rect x="8" y="10" width="10" height="14" fill="#a371f7" opacity="0.6" rx="1"/>
        <rect x="20" y="4" width="10" height="20" fill="#58a6ff" opacity="0.6" rx="1"/>
      </g>
      
      <text x="74" y="110" font-family="system-ui, sans-serif" font-size="15" font-weight="700" 
            fill="#a371f7" text-anchor="middle">BENCHMARK</text>
      <text x="74" y="130" font-family="system-ui, sans-serif" font-size="11" 
            fill="#57606a" text-anchor="middle">G2 gate</text>
      
      <text x="74" y="160" font-family="system-ui, sans-serif" font-size="11" font-weight="500" 
            fill="#1f2328" text-anchor="middle">Head-to-head</text>
      <text x="74" y="180" font-family="system-ui, sans-serif" font-size="10" 
            fill="#57606a" text-anchor="middle">vs each source</text>
      <text x="74" y="195" font-family="system-ui, sans-serif" font-size="10" 
            fill="#57606a" text-anchor="middle">+ baseline</text>
      
      <text x="74" y="225" font-family="system-ui, sans-serif" font-size="11" font-weight="500" 
            fill="#1f2328" text-anchor="middle">36/36 cells</text>
      <text x="74" y="242" font-family="system-ui, sans-serif" font-size="10" 
            fill="#57606a" text-anchor="middle">PASS → GO</text>
    </g>
    
    <!-- Card 6: PROMOTE -->
    <g transform="translate(840, 0)" filter="url(#cardShadow3)">
      <rect x="0" y="0" width="148" height="260" rx="12" fill="#ffffff" stroke="#3fb950" stroke-width="2"/>
      
      <g transform="translate(74, 50)">
        <circle r="32" fill="#3fb950" opacity="0.2" filter="url(#iconGlow)"/>
        <circle r="32" fill="none" stroke="#3fb950" stroke-width="3"/>
        <!-- Shield/check -->
        <path d="M0,-18 L0,-6" fill="none" stroke="#3fb950" stroke-width="3" stroke-linecap="round"/>
        <path d="M-10,-6 L0,2 L10,-6" fill="none" stroke="#3fb950" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M-8,-2 Q0,8 8,-2" fill="none" stroke="#3fb950" stroke-width="2" stroke-linecap="round"/>
      </g>
      
      <text x="74" y="110" font-family="system-ui, sans-serif" font-size="15" font-weight="700" 
            fill="#3fb950" text-anchor="middle">PROMOTE</text>
      <text x="74" y="130" font-family="system-ui, sans-serif" font-size="11" 
            fill="#57606a" text-anchor="middle">apply-moves</text>
      
      <text x="74" y="160" font-family="system-ui, sans-serif" font-size="11" font-weight="500" 
            fill="#1f2328" text-anchor="middle">Hash-bound</text>
      <text x="74" y="180" font-family="system-ui, sans-serif" font-size="10" 
            fill="#57606a" text-anchor="middle">non-destructive</text>
      <text x="74" y="195" font-family="system-ui, sans-serif" font-size="10" 
            fill="#57606a" text-anchor="middle">archive first</text>
      
      <text x="74" y="225" font-family="system-ui, sans-serif" font-size="11" font-weight="500" 
            fill="#1f2328" text-anchor="middle">SHA-256</text>
      <text x="74" y="242" font-family="system-ui, sans-serif" font-size="10" 
            fill="#57606a" text-anchor="middle">verified</text>
    </g>
  </g>
</svg>