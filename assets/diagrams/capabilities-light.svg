<svg role="img" aria-labelledby="caps-title" <title id="caps-title">Governance Capabilities — Six Key Features</title> <desc id="caps-title-desc">Overview of six key capabilities: M1 Discovery, M3 Council, M5 Loss-Check, M6 Golden Gate, Benchmarking, and Approval workflow.</desc> xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400">
  <rect width="1000" height="400" fill="#FFFFFF"/>
  <g transform="translate(40, 60)">
    <text font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#E6EDF3" letter-spacing="-0.03em">CAPABILITIES</text>
    
    <g transform="translate(0, 60)">
      <!-- Capability Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="220" height="180" rx="24" fill="#F8FAFC" stroke="rgba(15, 23, 42, 0.08)" stroke-width="1"/>
        <text x="24" y="44" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#2563EB">M1 DISCOVER</text>
        <text x="24" y="74" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#E6EDF3">Automatic Detection</text>
        <text x="24" y="104" font-family="system-ui, sans-serif" font-size="13" fill="#64748B">Scans Hermes, Claude Code, and OpenCode sources.</text>
      </g>
      <!-- Card 2 -->
      <g transform="translate(240, 0)">
        <rect width="220" height="180" rx="24" fill="#F8FAFC" stroke="rgba(15, 23, 42, 0.08)" stroke-width="1"/>
        <text x="24" y="44" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#2563EB">M3 COUNCIL</text>
        <text x="24" y="74" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#E6EDF3">Multi-Agent Consensus</text>
        <text x="24" y="104" font-family="system-ui, sans-serif" font-size="13" fill="#64748B">Independent reviews from 5 specialized AI advisors.</text>
      </g>
      <!-- Card 3 -->
      <g transform="translate(480, 0)">
        <rect width="220" height="180" rx="24" fill="#F8FAFC" stroke="rgba(15, 23, 42, 0.08)" stroke-width="1"/>
        <text x="24" y="44" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#2563EB">M5 LOSS-CHECK</text>
        <text x="24" y="74" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#E6EDF3">Integrity Verification</text>
        <text x="24" y="104" font-family="system-ui, sans-serif" font-size="13" fill="#64748B">Ensures no logic or data is lost during merging.</text>
      </g>
      <!-- Card 4 -->
      <g transform="translate(720, 0)">
        <rect width="220" height="180" rx="24" fill="#F8FAFC" stroke="rgba(15, 23, 42, 0.08)" stroke-width="1"/>
        <text x="24" y="44" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#2563EB">M6 GOLDEN GATE</text>
        <text x="24" y="74" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#E6EDF3">Behavioral Parity</text>
        <text x="24" y="104" font-family="system-ui, sans-serif" font-size="13" fill="#64748B">Zero-regression guarantee via unit test mirroring.</text>
      </g>
    </g>
  </g>
</svg>