<svg role="img" aria-labelledby="diff-title" <title id="diff-title">Why This Is Different — Traditional vs Governance Approach (Dark)</title> <desc id="diff-title-desc">Dark mode comparison diagram showing governance approach advantages over traditional methods.</desc> xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640">
  
  
  <defs>
    <filter id="glassShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="1200" height="640" fill="#050505"/>

  <!-- Header -->
  <g transform="translate(60, 60)">
    <text y="0" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#93C5FD" letter-spacing="0.1em">COMPARISON</text>
    <text y="40" font-family="system-ui, sans-serif" font-size="32" font-weight="800" fill="#E6EDF3" letter-spacing="-0.03em">WHY THIS IS DIFFERENT</text>
  </g>

  <!-- LEFT: TRADITIONAL -->
  <g transform="translate(60, 140)">
    <rect width="480" height="440" rx="32" fill="#0D1117" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    <text x="32" y="44" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#8B949E" letter-spacing="0.05em">TRADITIONAL APPROACH</text>
    <g transform="translate(32, 100)">
       <text y="20" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#E6EDF3">Blind LLM Merge</text>
       <text y="340" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FF7B72">18 REGRESSIONS IN PILOT</text>
    </g>
  </g>

  <!-- RIGHT: GOVERNANCE -->
  <g transform="translate(660, 100)">
    <rect width="480" height="520" rx="32" fill="#0D1117" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" filter="url(#glassShadow)"/>
    <rect x="4" y="4" width="472" height="512" rx="28" fill="#0D1117" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    <g transform="translate(32, 44)">
      <text font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#93C5FD" letter-spacing="0.05em">EVIDENCE-BASED PIPELINE</text>
      <text y="36" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#E6EDF3" letter-spacing="-0.02em">Governance Gates</text>
      
      <g transform="translate(0, 380)">
        <rect width="416" height="60" rx="16" fill="#93C5FD"/>
        <text x="208" y="36" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#050505" text-anchor="middle">VERIFIED SURVIVORS ONLY</text>
      </g>
    </g>
  </g>

</svg>