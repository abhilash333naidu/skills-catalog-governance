<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400">
  <rect width="1000" height="400" fill="#050505"/>
  <g transform="translate(40, 60)">
    <text font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#E6EDF3" letter-spacing="-0.03em">CAPABILITIES</text>
    
    <g transform="translate(0, 60)">
      <!-- Capability Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="220" height="180" rx="24" fill="#0D1117" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
        <text x="24" y="44" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#58A6FF">M1 DISCOVER</text>
        <text x="24" y="74" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#E6EDF3">Automatic Detection</text>
        <text x="24" y="104" font-family="system-ui, sans-serif" font-size="13" fill="#8B949E">Scans Hermes, Claude Code, and OpenCode sources.</text>
      </g>
      <!-- Card 2 -->
      <g transform="translate(240, 0)">
        <rect width="220" height="180" rx="24" fill="#0D1117" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
        <text x="24" y="44" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#58A6FF">M3 COUNCIL</text>
        <text x="24" y="74" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#E6EDF3">Multi-Agent Consensus</text>
        <text x="24" y="104" font-family="system-ui, sans-serif" font-size="13" fill="#8B949E">Independent reviews from 5 specialized AI advisors.</text>
      </g>
      <!-- Card 3 -->
      <g transform="translate(480, 0)">
        <rect width="220" height="180" rx="24" fill="#0D1117" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
        <text x="24" y="44" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#58A6FF">M5 LOSS-CHECK</text>
        <text x="24" y="74" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#E6EDF3">Integrity Verification</text>
        <text x="24" y="104" font-family="system-ui, sans-serif" font-size="13" fill="#8B949E">Ensures no logic or data is lost during merging.</text>
      </g>
      <!-- Card 4 -->
      <g transform="translate(720, 0)">
        <rect width="220" height="180" rx="24" fill="#0D1117" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
        <text x="24" y="44" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#58A6FF">M6 GOLDEN GATE</text>
        <text x="24" y="74" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#E6EDF3">Behavioral Parity</text>
        <text x="24" y="104" font-family="system-ui, sans-serif" font-size="13" fill="#8B949E">Zero-regression guarantee via unit test mirroring.</text>
      </g>
    </g>
  </g>
</svg>