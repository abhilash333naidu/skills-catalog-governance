<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="diff-title diff-desc">
  <title id="diff-title">Why This Is Different: Traditional vs Governance Approach</title>
  <desc id="diff-desc">Comparison of traditional blind LLM merge vs evidence-based pipeline.</desc>

  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="640" fill="#FFFFFF"/>

  <!-- Header -->
  <g transform="translate(60, 60)">
    <rect width="180" height="24" rx="12" fill="#0F172A" opacity="0.05"/>
    <text x="90" y="16" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="0.1em">COMPARISON</text>
    <text y="60" font-family="system-ui, sans-serif" font-size="32" font-weight="800" fill="#0F172A" letter-spacing="-0.03em">WHY THIS IS DIFFERENT</text>
  </g>

  <!-- LEFT: TRADITIONAL (Muted, Background-ish) -->
  <g transform="translate(60, 160)">
    <rect width="480" height="420" rx="32" fill="#F8FAFC" stroke="rgba(15, 23, 42, 0.08)" stroke-width="1"/>
    <text x="32" y="44" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#94A3B8" letter-spacing="0.05em">TRADITIONAL APPROACH</text>
    
    <g transform="translate(32, 80)">
      <text y="20" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#475569">Blind LLM Merge</text>
      <text y="44" font-family="system-ui, sans-serif" font-size="14" fill="#94A3B8">One-pass consolidation without behavior tests.</text>
      
      <g transform="translate(0, 80)">
         <rect width="416" height="60" rx="16" fill="#FFFFFF" stroke="rgba(15, 23, 42, 0.08)" stroke-width="1"/>
         <text x="16" y="34" font-family="system-ui, sans-serif" font-size="14" fill="#475569">1. Search candidates via grep</text>
      </g>
      <g transform="translate(0, 150)">
         <rect width="416" height="60" rx="16" fill="#FFFFFF" stroke="rgba(15, 23, 42, 0.08)" stroke-width="1"/>
         <text x="16" y="34" font-family="system-ui, sans-serif" font-size="14" fill="#475569">2. "Merge these into one file"</text>
      </g>
      <g transform="translate(0, 220)">
         <rect width="416" height="60" rx="16" fill="#FFFFFF" stroke="rgba(15, 23, 42, 0.08)" stroke-width="1"/>
         <text x="16" y="34" font-family="system-ui, sans-serif" font-size="14" fill="#475569">3. Hope it works in production</text>
      </g>
    </g>

    <!-- Fail Result -->
    <g transform="translate(32, 340)">
      <rect width="416" height="48" rx="12" fill="#EF4444" opacity="0.05"/>
      <text x="208" y="29" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#EF4444" text-anchor="middle">18 REGRESSIONS DETECTED IN PILOT</text>
    </g>
  </g>

  <!-- RIGHT: GOVERNANCE (Premium, Highlighted) -->
  <g transform="translate(660, 120)">
    <rect width="480" height="500" rx="32" fill="#FFFFFF" stroke="rgba(15, 23, 42, 0.08)" stroke-width="1" filter="url(#cardShadow)"/>
    <rect x="4" y="4" width="472" height="492" rx="28" fill="#FFFFFF" stroke="rgba(15, 23, 42, 0.04)" stroke-width="1"/>
    
    <g transform="translate(32, 44)">
      <text font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#2563EB" letter-spacing="0.05em">EVIDENCE-BASED PIPELINE</text>
      <text y="36" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#0F172A" letter-spacing="-0.02em">Governance Gates</text>
      
      <g transform="translate(0, 80)">
        <!-- Step Cards -->
        <g transform="translate(0, 0)">
          <rect width="416" height="64" rx="16" fill="#FFFFFF" stroke="#2563EB" stroke-opacity="0.2" stroke-width="1"/>
          <text x="20" y="36" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A">01. Discover & Cluster</text>
        </g>
        <g transform="translate(0, 80)">
          <rect width="416" height="64" rx="16" fill="#FFFFFF" stroke="#2563EB" stroke-opacity="0.2" stroke-width="1"/>
          <text x="20" y="36" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A">02. Multi-Agent Council Review</text>
        </g>
        <g transform="translate(0, 160)">
          <rect width="416" height="64" rx="16" fill="#FFFFFF" stroke="#2563EB" stroke-opacity="0.2" stroke-width="1"/>
          <text x="20" y="36" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A">03. Systematic Loss-Check</text>
        </g>
        <g transform="translate(0, 240)">
          <rect width="416" height="64" rx="16" fill="#FFFFFF" stroke="#10B981" stroke-opacity="0.2" stroke-width="1"/>
          <text x="20" y="36" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A">04. Canonical Benchmarking</text>
          <text x="396" y="36" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#10B981" text-anchor="end">36/36 PASS</text>
        </g>
      </g>

      <!-- Win Result -->
      <g transform="translate(0, 360)">
        <rect width="416" height="60" rx="16" fill="#2563EB"/>
        <text x="208" y="36" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">VERIFIED SURVIVORS ONLY</text>
      </g>
    </g>
  </g>

</svg>