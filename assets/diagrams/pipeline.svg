         <text x="40" y="98" text-anchor="middle" font-family="system-ui" font-size="10" fill="#8B949E">~30 sec</text>
       </g>
       <g transform="translate(440, 0)">
         <circle cx="40" cy="40" r="16" fill="#58A6FF"/>
         <text x="40" y="80" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="700" fill="#E6EDF3">M3 COUNCIL</text>
         <text x="40" y="98" text-anchor="middle" font-family="system-ui" font-size="10" fill="#8B949E">~5 min</text>
       </g>
       <g transform="translate(660, 0)">
