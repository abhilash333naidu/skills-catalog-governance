         <text x="40" y="80" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="700" fill="#E6EDF3">M5 VERIFY</text>
         <text x="40" y="98" text-anchor="middle" font-family="system-ui" font-size="10" fill="#8B949E">~3 min</text>
