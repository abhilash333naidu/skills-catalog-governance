<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-labelledby="ba-title ba-desc">
  <title id="ba-title">Before and After: Skill Sprawl → Governed Catalog</title>
  <desc id="ba-desc">Comparison of multi-harness skill sprawl before governance and a governed canonical catalog after (light)</desc>
  
  <defs>
    <linearGradient id="bgBa" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f6f8fa"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6f8fa"/>
    </linearGradient>
    <filter id="shadowBa" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <rect width="1000" height="260" fill="url(#bgBa)"/>
  
  <!-- BEFORE -->
  <g transform="translate(30, 30)">
    <rect x="0" y="0" width="440" height="200" rx="12" fill="#ffffff" stroke="#f85149" stroke-width="1.5" filter="url(#shadowBa)"/>
    
    <rect x="0" y="0" width="440" height="36" rx="12" fill="#f85149" opacity="0.1"/>
    <rect x="0" y="20" width="440" height="16" fill="#f85149" opacity="0.1"/>
    <circle cx="16" cy="18" r="8" fill="#f85149"/>
    <text x="34" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f85149">BEFORE: Skill Sprawl</text>
    
    <!-- Stack of duplicate skills -->
    <g transform="translate(20, 52)">
      <g>
        <rect x="0" y="0" width="400" height="32" rx="4" fill="#1f2937" stroke="#d0d7de"/>
        <circle cx="12" cy="16" r="6" fill="#f85149" opacity="0.5"/>
        <text x="28" y="22" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" fill="#1f2328">~/.hermes/skills/</text>
        <text x="280" y="22" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" fill="#58a6ff">git-commit-formatter</text>
      </g>
      <g transform="translate(0, 36)">
        <rect x="0" y="0" width="400" height="32" rx="4" fill="#1f2937" stroke="#d0d7de"/>
        <circle cx="12" cy="16" r="6" fill="#f85149" opacity="0.5"/>
        <text x="28" y="22" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" fill="#1f2328">~/.claude/skills/</text>
        <text x="280" y="22" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" fill="#d29922">writing-commit-messages</text>
      </g>
      <g transform="translate(0, 72)">
        <rect x="0" y="0" width="400" height="32" rx="4" fill="#1f2937" stroke="#d0d7de"/>
        <circle cx="12" cy="16" r="6" fill="#f85149" opacity="0.5"/>
        <text x="28" y="22" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" fill="#1f2328">~/.config/opencode/</text>
        <text x="280" y="22" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" fill="#a371f7">commit-msg-assistant</text>
      </g>
      <g transform="translate(0, 108)">
        <rect x="0" y="0" width="400" height="32" rx="4" fill="#1f2937" stroke="#d0d7de" stroke-dasharray="4,4"/>
        <circle cx="12" cy="16" r="6" fill="#f85149" opacity="0.3"/>
        <text x="28" y="22" font-family="system-ui, sans-serif" font-size="12" fill="#57606a">... 208 more across all stores</text>
      </g>
      <g transform="translate(0, 144)">
        <rect x="0" y="0" width="400" height="32" rx="4" fill="#2d1b1b" stroke="#f85149" stroke-width="2" stroke-dasharray="6,3"/>
        <circle cx="12" cy="16" r="6" fill="#f85149"/>
        <text x="28" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#f85149">Problem: 3 commit-message skills, uncertain which best</text>
      </g>
    </g>
  </g>
  
  <!-- ARROW -->
  <g transform="translate(475, 115)">
    <text x="25" y="0" font-family="system-ui, sans-serif" font-size="28" font-weight="700" 
          fill="#d0d7de" text-anchor="middle">→</text>
  </g>
  
  <!-- AFTER -->
  <g transform="translate(530, 30)">
    <rect x="0" y="0" width="440" height="200" rx="12" fill="#ffffff" stroke="#3fb950" stroke-width="2" filter="url(#shadowBa)"/>
    
    <rect x="0" y="0" width="440" height="36" rx="12" fill="#3fb950" opacity="0.1"/>
    <rect x="0" y="20" width="440" height="16" fill="#3fb950" opacity="0.1"/>
    <circle cx="16" cy="18" r="8" fill="#3fb950"/>
    <text x="34" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#3fb950">AFTER: Governed Canonical Catalog</text>
    
    <g transform="translate(20, 52)">
      <g>
        <rect x="0" y="0" width="400" height="64" rx="8" fill="#1f2937" stroke="#3fb950" stroke-width="2"/>
        <rect x="0" y="0" width="6" height="64" rx="3" fill="#3fb950"/>
        <text x="20" y="20" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#3fb950">✓ canonical-commit-message</text>
        <text x="20" y="40" font-family="system-ui, sans-serif" font-size="11" fill="#57606a">merged from 3 sources · SHA-256 verified · provenance recorded</text>
        <text x="20" y="55" font-family="system-ui, sans-serif" font-size="10" fill="#8c959f">golden gate 6/6 · benchmark 36/36 · hash-bound approval</text>
      </g>
      <g transform="translate(0, 76)">
        <rect x="0" y="0" width="400" height="32" rx="4" fill="#1f2937" stroke="#d29922" stroke-width="1.5"/>
        <rect x="0" y="0" width="4" height="32" rx="2" fill="#d29922"/>
        <text x="16" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#d29922">ce-commit-executor</text>
        <text x="200" y="22" font-family="system-ui, sans-serif" font-size="11" fill="#57606a">recategorized (executor, kept separate)</text>
      </g>
      <g transform="translate(0, 116)">
        <rect x="0" y="0" width="400" height="32" rx="4" fill="#1f2937" stroke="#d0d7de" stroke-dasharray="4,4"/>
        <rect x="0" y="0" width="4" height="32" rx="2" fill="#57606a"/>
        <text x="16" y="22" font-family="system-ui, sans-serif" font-size="12" fill="#57606a">skills-archive/ (191 preserved, never deleted)</text>
      </g>
      <g transform="translate(0, 156)">
        <rect x="0" y="0" width="400" height="24" rx="4" fill="#142d14" stroke="#3fb950"/>
        <text x="200" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#3fb950" text-anchor="middle">Result: 2 canonical skills, 191 archived with full provenance</text>
      </g>
    </g>
  </g>
</svg>