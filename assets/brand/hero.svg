<svg role="img" aria-labelledby="hero-title" <title id="hero-title">Skills Catalog Governance — Agent Skill Pipeline (Dark)</title> <desc id="hero-title-desc">Dark mode version of the governance pipeline visualization with glassmorphism effects and OLED black background.</desc> xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 640">
  
  
  <defs>
    <filter id="glassShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="24" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    
    <symbol id="icon-node" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
    </symbol>
    <symbol id="icon-shield" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    </symbol>
    <symbol id="icon-catalog" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 19.5A2.5 2.5 0 0 0 6.5 22H20M4 19.5V3a1 1 0 0 1 1-1h15v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
    </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24">
       <circle cx="11" cy="11" r="8" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m21 21-4.3-4.3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-users" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="1.5" d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/><path fill="none" stroke="currentColor" stroke-width="1.5" d="M23 21v-2a4 4 0 0 0-3-3.87"/><path fill="none" stroke="currentColor" stroke-width="1.5" d="M16 3.13a4 4 0 0 1 0 7.75"/>
    </symbol>
  </defs>

  <rect width="1440" height="640" fill="#050505"/>

  <!-- Eyebrows -->
  <g transform="translate(80, 60)">
    <rect width="120" height="20" rx="10" fill="#93C5FD" opacity="0.15"/>
    <text x="60" y="14" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#93C5FD" text-anchor="middle" letter-spacing="0.1em">SOURCES</text>
  </g>

  <!-- SOURCE COLUMN -->
  <g transform="translate(80, 100)">
    <g transform="translate(0, 0)">
      <rect width="260" height="80" rx="20" fill="#0D1117" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" filter="url(#glassShadow)"/>
      <rect x="4" y="4" width="252" height="72" rx="16" fill="#0D1117" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
      <g transform="translate(20, 20)">
        <use href="#icon-node" x="-10" y="-10" width="20" height="20" color="#58A6FF"/>
      </g>
      <text x="60" y="34" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#E6EDF3" letter-spacing="-0.02em">Hermes Agent</text>
      <text x="60" y="54" font-family="system-ui, sans-serif" font-size="13" fill="#8B949E">~/.hermes/skills</text>
    </g>
    <g transform="translate(0, 100)">
      <rect width="260" height="80" rx="20" fill="#0D1117" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" filter="url(#glassShadow)"/>
      <rect x="4" y="4" width="252" height="72" rx="16" fill="#0D1117" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
      <g transform="translate(20, 20)">
        <use href="#icon-node" x="-10" y="-10" width="20" height="20" color="#D29922"/>
      </g>
      <text x="60" y="34" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#E6EDF3" letter-spacing="-0.02em">Claude Code</text>
      <text x="60" y="54" font-family="system-ui, sans-serif" font-size="13" fill="#8B949E">~/.claude/skills</text>
    </g>
  </g>

  <!-- PIPELINE -->
  <g transform="translate(420, 100)">
    <g transform="translate(0, 0)">
      <rect width="180" height="120" rx="24" fill="#0D1117" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" filter="url(#glassShadow)"/>
      <g transform="translate(24, 30)"><use href="#icon-search" width="20" height="20" color="#58A6FF"/></g>
      <text x="24" y="70" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#E6EDF3">DISCOVER</text>
    </g>
    <g transform="translate(200, 0)">
      <rect width="180" height="120" rx="24" fill="#0D1117" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" filter="url(#glassShadow)"/>
      <g transform="translate(24, 30)"><use href="#icon-users" width="20" height="20" color="#D29922"/></g>
      <text x="24" y="70" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#E6EDF3">GROUP</text>
    </g>
    <g transform="translate(400, 0)">
      <rect width="180" height="120" rx="24" fill="#0D1117" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" filter="url(#glassShadow)"/>
      <g transform="translate(24, 30)"><use href="#icon-shield" width="20" height="20" color="#BC8CFF"/></g>
      <text x="24" y="70" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#E6EDF3">COUNCIL</text>
    </g>
    
    <g transform="translate(0, 180)">
      <rect width="580" height="100" rx="24" fill="#0D1117" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" filter="url(#glassShadow)"/>
      <text x="32" y="44" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#E6EDF3">GOVERNANCE GATES</text>
      <rect x="32" y="68" width="516" height="6" rx="3" fill="#3FB950" opacity="0.3"/>
      <rect x="32" y="68" width="516" height="6" rx="3" fill="#3FB950"/>
    </g>
  </g>

  <!-- CATALOG -->
  <g transform="translate(1080, 100)">
     <rect width="280" height="400" rx="24" fill="#0D1117" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" filter="url(#glassShadow)"/>
     <text x="32" y="44" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#E6EDF3">Verified Catalog</text>
     <g transform="translate(32, 80)">
       <text y="20" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#E6EDF3">commit-message</text>
       <text y="40" font-family="system-ui, sans-serif" font-size="12" fill="#8B949E">SHA-256 verified</text>
     </g>
  </g>

</svg>