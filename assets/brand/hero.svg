<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Skills Catalog Governance — Agent Skill Pipeline</title>
  <desc id="hero-desc">Visual pipeline showing multiple agent skill sources flowing through governance stages into a canonical verified catalog</desc>
  
  <!-- Definitions -->
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
    
    <linearGradient id="sourceGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#388bfd"/>
    </linearGradient>
    
    <linearGradient id="governanceGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a371f7"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    
    <linearGradient id="outputGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </linearGradient>
    
    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8b949e"/>
    </marker>
    
    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Node style -->
    <filter id="nodeShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="480" fill="url(#bgGradient)"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#58a6ff" stroke-width="0.5"/>
    </pattern>
    <rect width="1200" height="480" fill="url(#grid)"/>
  </g>
  
  <!-- Left side: Agent Sources -->
  <g transform="translate(80, 60)">
    <!-- Source label -->
    <text x="0" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="13" font-weight="600" fill="#8b949e" text-transform="uppercase" letter-spacing="1.5">
      AGENT SKILL SOURCES
    </text>
    
    <!-- Source cards -->
    <g class="sources">
      <!-- Hermes -->
      <g transform="translate(0, 40)" filter="url(#nodeShadow)">
        <rect x="0" y="0" width="200" height="72" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
        <circle cx="20" cy="36" r="18" fill="url(#sourceGradient)"/>
        <text x="50" y="30" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Hermes</text>
        <text x="50" y="52" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">~/.hermes/skills</text>
        <g transform="translate(165, 36)">
          <circle r="10" fill="#58a6ff" opacity="0.2"/>
          <text x="0" y="4" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#58a6ff">73</text>
        </g>
      </g>
      
      <!-- Claude Code -->
      <g transform="translate(0, 122)" filter="url(#nodeShadow)">
        <rect x="0" y="0" width="200" height="72" rx="10" fill="#161b22" stroke="#f78166" stroke-width="1.5"/>
        <circle cx="20" cy="36" r="18" fill="#f78166"/>
        <text x="50" y="30" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Claude Code</text>
        <text x="50" y="52" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">~/.claude/skills</text>
        <g transform="translate(165, 36)">
          <circle r="10" fill="#f78166" opacity="0.2"/>
          <text x="0" y="4" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#f78166">41</text>
        </g>
      </g>
      
      <!-- OpenCode -->
      <g transform="translate(0, 204)" filter="url(#nodeShadow)">
        <rect x="0" y="0" width="200" height="72" rx="10" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
        <circle cx="20" cy="36" r="18" fill="#d29922"/>
        <text x="50" y="30" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#e6edf3">OpenCode</text>
        <text x="50" y="52" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">~/.config/opencode/skills</text>
        <g transform="translate(165, 36)">
          <circle r="10" fill="#d29922" opacity="0.2"/>
          <text x="0" y="4" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#d29922">36</text>
        </g>
      </g>
      
      <!-- Codex -->
      <g transform="translate(0, 286)" filter="url(#nodeShadow)">
        <rect x="0" y="0" width="200" height="72" rx="10" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
        <circle cx="20" cy="36" r="18" fill="#a371f7"/>
        <text x="50" y="30" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Codex</text>
        <text x="50" y="52" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">~/.codex/skills</text>
        <g transform="translate(165, 36)">
          <circle r="10" fill="#a371f7" opacity="0.2"/>
          <text x="0" y="4" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#a371f7">28</text>
        </g>
      </g>
      
      <!-- Other -->
      <g transform="translate(0, 368)" filter="url(#nodeShadow)">
        <rect x="0" y="0" width="200" height="72" rx="10" fill="#161b22" stroke="#8b949e" stroke-width="1" stroke-dasharray="4,4"/>
        <circle cx="20" cy="36" r="18" fill="#8b949e" opacity="0.3"/>
        <text x="50" y="30" font-family="system-ui, sans-serif" font-size="15" font-weight="500" fill="#8b949e">Other / External</text>
        <text x="50" y="52" font-family="system-ui, sans-serif" font-size="12" fill="#6e7681">vendored, custom paths</text>
        <g transform="translate(165, 36)">
          <circle r="10" fill="#8b949e" opacity="0.15"/>
          <text x="0" y="4" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="500" fill="#8b949e">33</text>
        </g>
      </g>
    </g>
  </g>
  
  <!-- Center: Governance Pipeline -->
  <g transform="translate(360, 80)">
    <text x="100" y="0" font-family="system-ui, sans-serif" font-size="13" font-weight="600" 
          fill="#8b949e" text-transform="uppercase" letter-spacing="1.5" text-anchor="middle">
      GOVERNANCE PIPELINE
    </text>
    
    <!-- Pipeline stages -->
    <g class="pipeline-stages">
      <!-- Stage 1: Discover -->
      <g transform="translate(10, 40)" filter="url(#nodeShadow)">
        <rect x="0" y="0" width="180" height="68" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
        <circle cx="24" cy="34" r="16" fill="url(#sourceGradient)"/>
        <text x="52" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e6edf3">DISCOVER</text>
        <text x="52" y="46" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">detect-skills</text>
        <text x="158" y="38" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#58a6ff" text-anchor="end">211</text>
      </g>
      
      <!-- Arrow -->
      <path d="M 200 74 H 230" stroke="#8b949e" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
      
      <!-- Stage 2: Group -->
      <g transform="translate(240, 40)" filter="url(#nodeShadow)">
        <rect x="0" y="0" width="180" height="68" rx="10" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
        <circle cx="24" cy="34" r="16" fill="#d29922"/>
        <text x="52" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e6edf3">GROUP</text>
        <text x="52" y="46" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">detect-groups</text>
        <text x="158" y="38" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#d29922" text-anchor="end">19</text>
      </g>
      
      <!-- Arrow -->
      <path d="M 430 74 H 460" stroke="#8b949e" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
      
      <!-- Stage 3: Council -->
      <g transform="translate(470, 40)" filter="url(#nodeShadow)">
        <rect x="0" y="0" width="180" height="68" rx="10" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
        <circle cx="24" cy="34" r="16" fill="url(#governanceGradient)"/>
        <text x="52" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e6edf3">COUNCIL</text>
        <text x="52" y="46" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">5 advisors → 1 verdict</text>
        <text x="158" y="38" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#a371f7" text-anchor="end">MERGE</text>
      </g>
    </g>
    
    <!-- Second row of stages -->
    <g class="pipeline-stages-row2" transform="translate(0, 130)">
      <!-- Stage 4: Consolidate -->
      <g transform="translate(10, 0)" filter="url(#nodeShadow)">
        <rect x="0" y="0" width="180" height="68" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
        <circle cx="24" cy="34" r="16" fill="#3fb950"/>
        <text x="52" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e6edf3">CONSOLIDATE</text>
        <text x="52" y="46" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">build master</text>
      </g>
      
      <path d="M 200 34 H 230" stroke="#8b949e" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
      
      <!-- Stage 5: Loss Check -->
      <g transform="translate(240, 0)" filter="url(#nodeShadow)">
        <rect x="0" y="0" width="180" height="68" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
        <circle cx="24" cy="34" r="16" fill="#3fb950" opacity="0.8"/>
        <text x="52" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e6edf3">LOSS CHECK</text>
        <text x="52" y="46" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">verify content</text>
        <text x="158" y="38" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#3fb950" text-anchor="end">PASS</text>
      </g>
      
      <path d="M 430 34 H 460" stroke="#8b949e" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
      
      <!-- Stage 6: Golden Gate -->
      <g transform="translate(470, 0)" filter="url(#nodeShadow)">
        <rect x="0" y="0" width="180" height="68" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
        <circle cx="24" cy="34" r="16" fill="#3fb950" opacity="0.6"/>
        <text x="52" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e6edf3">GOLDEN GATE</text>
        <text x="52" y="46" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">verify output</text>
        <text x="158" y="38" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#3fb950" text-anchor="end">6/6</text>
      </g>
    </g>
    
    <!-- Third row -->
    <g class="pipeline-stages-row3" transform="translate(0, 220)">
      <g transform="translate(10, 0)" filter="url(#nodeShadow)">
        <rect x="0" y="0" width="180" height="68" rx="10" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
        <circle cx="24" cy="34" r="16" fill="url(#governanceGradient)"/>
        <text x="52" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e6edf3">BENCHMARK</text>
        <text x="52" y="46" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">G2 comparison</text>
        <text x="158" y="38" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#a371f7" text-anchor="end">36/36</text>
      </g>
      
      <path d="M 200 34 H 230" stroke="#8b949e" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
      
      <g transform="translate(240, 0)" filter="url(#nodeShadow)">
        <rect x="0" y="0" width="180" height="68" rx="10" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
        <circle cx="24" cy="34" r="16" fill="url(#governanceGradient)" opacity="0.8"/>
        <text x="52" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e6edf3">APPROVAL</text>
        <text x="52" y="46" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">hash-bound</text>
        <text x="158" y="38" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#a371f7" text-anchor="end">✓</text>
      </g>
      
      <path d="M 430 34 H 460" stroke="#8b949e" stroke-width="2" marker-end="url(#arrowhead)" fill="none"/>
      
      <g transform="translate(470, 0)" filter="url(#nodeShadow)">
        <rect x="0" y="0" width="180" height="68" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
        <circle cx="24" cy="34" r="16" fill="url(#outputGradient)"/>
        <text x="52" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e6edf3">PROMOTE</text>
        <text x="52" y="46" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">archive + commit</text>
        <text x="158" y="38" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#3fb950" text-anchor="end">2</text>
      </g>
    </g>
  </g>
  
  <!-- Right side: Output -->
  <g transform="translate(920, 60)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="13" font-weight="600" 
          fill="#8b949e" text-transform="uppercase" letter-spacing="1.5">
      CANONICAL CATALOG
    </text>
    
    <!-- Output card -->
    <g transform="translate(0, 40)" filter="url(#nodeShadow)">
      <rect x="0" y="0" width="200" height="380" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
      
      <!-- Header -->
      <rect x="0" y="0" width="200" height="56" rx="12" fill="#3fb950" opacity="0.1"/>
      <text x="100" y="36" font-family="system-ui, sans-serif" font-size="16" font-weight="600" 
            fill="#3fb950" text-anchor="middle">VERIFIED SKILLS</text>
      
      <!-- Skill cards -->
      <g transform="translate(16, 72)">
        <!-- Skill 1: survivor -->
        <g filter="url(#nodeShadow)">
          <rect x="0" y="0" width="168" height="96" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
          <text x="12" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#3fb950">✓ survivor</text>
          <text x="12" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#e6edf3">canonical-commit-message</text>
          <text x="12" y="62" font-family="system-ui, sans-serif" font-size="10" fill="#8b949e">merged from 3 sources</text>
          <text x="12" y="80" font-family="system-ui, sans-serif" font-size="10" fill="#3fb950">SHA-256 verified ✓</text>
        </g>
        
        <!-- Skill 2: survivor -->
        <g transform="translate(0, 112)" filter="url(#nodeShadow)">
          <rect x="0" y="0" width="168" height="96" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
          <text x="12" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#3fb950">✓ survivor</text>
          <text x="12" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#e6edf3">ce-commit-executor</text>
          <text x="12" y="62" font-family="system-ui, sans-serif" font-size="10" fill="#8b949e">recategorized, kept separate</text>
          <text x="12" y="80" font-family="system-ui, sans-serif" font-size="10" fill="#3fb950">SHA-256 verified ✓</text>
        </g>
        
        <!-- Archived count -->
        <g transform="translate(0, 224)">
          <rect x="0" y="0" width="168" height="56" rx="8" fill="#0d1117" stroke="#8b949e" stroke-width="1" stroke-dasharray="4,4"/>
          <text x="84" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#8b949e" text-anchor="middle">191 archived</text>
          <text x="84" y="40" font-family="system-ui, sans-serif" font-size="10" fill="#6e7681" text-anchor="middle">moved to skills-archive/</text>
        </g>
      </g>
    </g>
  </g>
  
  <!-- Bottom summary bar -->
  <g transform="translate(80, 420)">
    <rect x="0" y="0" width="1040" height="40" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="520" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="500" 
          fill="#e6edf3" text-anchor="middle">
      <tspan fill="#58a6ff">211</tspan> skills discovered → 
      <tspan fill="#d29922">19</tspan> candidate families → 
      <tspan fill="#a371f7">Council</tspan> verdict → 
      <tspan fill="#3fb950">6/6</tspan> golden gate → 
      <tspan fill="#a371f7">36/36</tspan> benchmark → 
      <tspan fill="#3fb950" font-weight="600">2 survivors promoted</tspan>
    </text>
  </g>
</svg>