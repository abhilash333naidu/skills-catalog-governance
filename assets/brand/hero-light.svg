<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 640" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Skills Catalog Governance — Agent Skill Pipeline</title>
  <desc id="hero-desc">High-end visualization of the AI agent skill governance pipeline.</desc>

  <defs>
    <filter id="ambientShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
    
    <linearGradient id="orbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Ultra-light Icons -->
    <symbol id="icon-node" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
    </symbol>
    <symbol id="icon-shield" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    </symbol>
    <symbol id="icon-catalog" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 19.5A2.5 2.5 0 0 0 6.5 22H20M4 19.5V3a1 1 0 0 1 1-1h15v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
    </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24">
       <circle cx="11" cy="11" r="8" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m21 21-4.3-4.3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-users" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="1.5" d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/><path fill="none" stroke="currentColor" stroke-width="1.5" d="M23 21v-2a4 4 0 0 0-3-3.87"/><path fill="none" stroke="currentColor" stroke-width="1.5" d="M16 3.13a4 4 0 0 1 0 7.75"/>
    </symbol>
  </defs>

  <rect width="1440" height="640" fill="url(#orbGrad)"/>

  <!-- Section Headers (Eyebrow Tags) -->
  <g transform="translate(80, 60)">
    <rect width="140" height="24" rx="12" fill="#2563EB" opacity="0.1"/>
    <text x="70" y="16" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#2563EB" text-anchor="middle" letter-spacing="0.1em">SOURCES</text>
  </g>

  <g transform="translate(420, 60)">
    <rect width="160" height="24" rx="12" fill="#7C3AED" opacity="0.1"/>
    <text x="80" y="16" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#7C3AED" text-anchor="middle" letter-spacing="0.1em">PIPELINE</text>
  </g>

  <g transform="translate(1080, 60)">
    <rect width="140" height="24" rx="12" fill="#10B981" opacity="0.1"/>
    <text x="70" y="16" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#10B981" text-anchor="middle" letter-spacing="0.1em">CATALOG</text>
  </g>

  <!-- SOURCE COLUMN -->
  <g transform="translate(80, 100)">
    <!-- Source Card 1 -->
    <g transform="translate(0, 0)">
      <rect width="260" height="80" rx="20" fill="#FFFFFF" stroke="rgba(15, 23, 42, 0.08)" stroke-width="1" filter="url(#ambientShadow)"/>
      <rect x="4" y="4" width="252" height="72" rx="16" fill="#FFFFFF" stroke="rgba(15, 23, 42, 0.04)" stroke-width="1"/>
      <g transform="translate(20, 20)">
        <circle r="20" fill="#2563EB" opacity="0.05"/>
        <use href="#icon-node" x="-10" y="-10" width="20" height="20" color="#2563EB"/>
      </g>
      <text x="60" y="34" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#0F172A" letter-spacing="-0.02em">Hermes Agent</text>
      <text x="60" y="54" font-family="system-ui, sans-serif" font-size="13" fill="#94A3B8">~/.hermes/skills</text>
      <text x="240" y="44" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#2563EB" text-anchor="end">73</text>
    </g>

    <!-- Source Card 2 -->
    <g transform="translate(0, 100)">
      <rect width="260" height="80" rx="20" fill="#FFFFFF" stroke="rgba(15, 23, 42, 0.08)" stroke-width="1" filter="url(#ambientShadow)"/>
      <rect x="4" y="4" width="252" height="72" rx="16" fill="#FFFFFF" stroke="rgba(15, 23, 42, 0.04)" stroke-width="1"/>
      <g transform="translate(20, 20)">
        <circle r="20" fill="#D97706" opacity="0.05"/>
        <use href="#icon-node" x="-10" y="-10" width="20" height="20" color="#D97706"/>
      </g>
      <text x="60" y="34" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#0F172A" letter-spacing="-0.02em">Claude Code</text>
      <text x="60" y="54" font-family="system-ui, sans-serif" font-size="13" fill="#94A3B8">~/.claude/skills</text>
      <text x="240" y="44" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#D97706" text-anchor="end">41</text>
    </g>

    <!-- Source Card 3 -->
    <g transform="translate(0, 200)">
      <rect width="260" height="80" rx="20" fill="#FFFFFF" stroke="rgba(15, 23, 42, 0.08)" stroke-width="1" filter="url(#ambientShadow)"/>
      <rect x="4" y="4" width="252" height="72" rx="16" fill="#FFFFFF" stroke="rgba(15, 23, 42, 0.04)" stroke-width="1"/>
      <g transform="translate(20, 20)">
        <circle r="20" fill="#7C3AED" opacity="0.05"/>
        <use href="#icon-node" x="-10" y="-10" width="20" height="20" color="#7C3AED"/>
      </g>
      <text x="60" y="34" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#0F172A" letter-spacing="-0.02em">OpenCode</text>
      <text x="60" y="54" font-family="system-ui, sans-serif" font-size="13" fill="#94A3B8">~/.opencode/skills</text>
      <text x="240" y="44" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#7C3AED" text-anchor="end">36</text>
    </g>
  </g>

  <!-- PIPELINE COLUMN (Bento Staggered) -->
  <g transform="translate(420, 100)">
    <!-- Stage 1: Discover -->
    <g transform="translate(0, 0)">
      <rect width="180" height="120" rx="24" fill="#FFFFFF" stroke="rgba(15, 23, 42, 0.08)" stroke-width="1" filter="url(#ambientShadow)"/>
      <rect x="4" y="4" width="172" height="112" rx="20" fill="#FFFFFF" stroke="rgba(15, 23, 42, 0.04)" stroke-width="1"/>
      <g transform="translate(24, 30)">
        <use href="#icon-search" width="20" height="20" color="#2563EB"/>
      </g>
      <text x="24" y="70" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A" letter-spacing="-0.01em">DISCOVER</text>
      <text x="24" y="90" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8">211 candidates</text>
    </g>

    <!-- Stage 2: Group -->
    <g transform="translate(200, 0)">
      <rect width="180" height="120" rx="24" fill="#FFFFFF" stroke="rgba(15, 23, 42, 0.08)" stroke-width="1" filter="url(#ambientShadow)"/>
      <rect x="4" y="4" width="172" height="112" rx="20" fill="#FFFFFF" stroke="rgba(15, 23, 42, 0.04)" stroke-width="1"/>
      <g transform="translate(24, 30)">
        <use href="#icon-users" width="20" height="20" color="#D97706"/>
      </g>
      <text x="24" y="70" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A" letter-spacing="-0.01em">GROUP</text>
      <text x="24" y="90" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8">19 families</text>
    </g>

    <!-- Stage 3: Council -->
    <g transform="translate(400, 0)">
      <rect width="180" height="120" rx="24" fill="#FFFFFF" stroke="rgba(15, 23, 42, 0.08)" stroke-width="1" filter="url(#ambientShadow)"/>
      <rect x="4" y="4" width="172" height="112" rx="20" fill="#FFFFFF" stroke="rgba(15, 23, 42, 0.04)" stroke-width="1"/>
      <g transform="translate(24, 30)">
        <use href="#icon-shield" width="20" height="20" color="#7C3AED"/>
      </g>
      <text x="24" y="70" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A" letter-spacing="-0.01em">COUNCIL</text>
      <text x="24" y="90" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8">Consensus verdict</text>
    </g>

    <!-- Pipeline Horizontal Rule -->
    <path d="M 0 150 H 580" stroke="rgba(15, 23, 42, 0.08)" stroke-width="1" stroke-dasharray="4,4"/>

    <!-- Stage 4: Verify (Large Card) -->
    <g transform="translate(0, 180)">
      <rect width="580" height="100" rx="24" fill="#FFFFFF" stroke="rgba(15, 23, 42, 0.08)" stroke-width="1" filter="url(#ambientShadow)"/>
      <rect x="4" y="4" width="572" height="92" rx="20" fill="#FFFFFF" stroke="rgba(15, 23, 42, 0.04)" stroke-width="1"/>
      <g transform="translate(24, 30)">
        <use href="#icon-shield" width="24" height="24" color="#10B981"/>
      </g>
      <text x="64" y="40" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0F172A" letter-spacing="-0.01em">GOVERNANCE GATES</text>
      <text x="64" y="64" font-family="system-ui, sans-serif" font-size="13" fill="#475569">Loss Check (Pass) • Golden Gate (6/6) • Benchmarks (36/36)</text>
      
      <!-- Progress Bar -->
      <rect x="64" y="76" width="480" height="6" rx="3" fill="#94A3B8" opacity="0.1"/>
      <rect x="64" y="76" width="480" height="6" rx="3" fill="#10B981"/>
    </g>
  </g>

  <!-- CATALOG COLUMN -->
  <g transform="translate(1080, 100)">
     <rect width="280" height="400" rx="24" fill="#FFFFFF" stroke="rgba(15, 23, 42, 0.08)" stroke-width="1" filter="url(#ambientShadow)"/>
     <rect x="4" y="4" width="272" height="392" rx="20" fill="#FFFFFF" stroke="rgba(15, 23, 42, 0.04)" stroke-width="1"/>
     
     <g transform="translate(24, 30)">
        <use href="#icon-catalog" width="20" height="20" color="#10B981"/>
     </g>
     <text x="56" y="45" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Verified Catalog</text>
     
     <path d="M 24 60 H 256" stroke="rgba(15, 23, 42, 0.08)" stroke-width="1"/>
     
     <!-- Skill Entry 1 -->
     <g transform="translate(24, 80)">
       <text x="0" y="20" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#0F172A">commit-message</text>
       <text x="0" y="40" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8">SHA-256: 8f2c... verified</text>
       <rect y="50" width="232" height="1" fill="rgba(15, 23, 42, 0.08)"/>
     </g>

     <!-- Skill Entry 2 -->
     <g transform="translate(24, 150)">
       <text x="0" y="20" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#0F172A">git-workflow</text>
       <text x="0" y="40" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8">SHA-256: 3a1e... verified</text>
     </g>

     <!-- Scale Indicator -->
     <g transform="translate(24, 340)">
       <rect width="232" height="40" rx="12" fill="#10B981" opacity="0.05"/>
       <text x="116" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#10B981" text-anchor="middle">2 PROMOTED / 191 ARCHIVED</text>
     </g>
  </g>

  <!-- Connection Lines (Fluid mass) -->
  <g opacity="0.15">
    <path d="M 340 140 Q 380 140 420 160" fill="none" stroke="#0F172A" stroke-width="2"/>
    <path d="M 340 240 Q 380 240 420 160" fill="none" stroke="#0F172A" stroke-width="2"/>
    <path d="M 340 340 Q 380 340 420 160" fill="none" stroke="#0F172A" stroke-width="2"/>
    
    <path d="M 1000 230 Q 1040 230 1080 300" fill="none" stroke="#0F172A" stroke-width="2"/>
  </g>

</svg>